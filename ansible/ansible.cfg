[defaults]
inventory = inventory.yml
interpreter_python = auto_silent
retry_files_enabled = False
# YAML-formatted results. The community.general 'yaml' callback was removed in
# collection 12.0.0; this is its replacement in ansible-core (2.13+).
stdout_callback = default
result_format = yaml
timeout = 60
forks = 5

[ssh_connection]
# The Jetson is reached over Tailscale, usually through a DERP relay, so
# keep the session alive and allow a slow first connection.
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -o ConnectTimeout=60
pipelining = True
